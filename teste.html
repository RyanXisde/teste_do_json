<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafés</title>

    <link rel="stylesheet" href="style.css">
</head>
<body onload="cafe()">

    <div id="destino">

        <div class="card">
            <img src="img/cafe1.jpg" alt="Café 1">

            <div class="conteudo">
                <h3>Café Especial</h3>

                <p>
                    Café muito bom com ambiente confortável.
                </p>

                <button>Saiba mais</button>
            </div>
        </div>

        <div class="card">
            <img src="img/cafe2.jpg" alt="Café 2">

            <div class="conteudo">
                <h3>Café Premium</h3>

                <p>
                    Lugar bonito para tomar café com amigos.
                </p>

                <button>Saiba mais</button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
